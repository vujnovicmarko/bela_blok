name: bela_blok
description: "Aplikacija za bilježenje rezultata kartaške igre Bela"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.3

dependencies:
  flutter:
    sdk: flutter
  flutter_confetti: ^0.9.2
  flutter_launcher_icons: ^0.14.4
  material_symbols_icons: ^4.2960.0
  path: ^1.9.1
  shared_preferences: ^2.5.6
  sqflite: ^2.4.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: "launcher_icon"
  ios: false
  image_path: "assets/images/app_icon.png"
  adaptive_icon_background: "#98BB6C"
  adaptive_icon_foreground: "assets/images/app_icon.png"
  min_sdk_android: 21
